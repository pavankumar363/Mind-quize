<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Take Quiz | Mind Quiz</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/quiz.css"></head>
<body><header class="quiz-header"><a class="brand" href="student.html"><span class="brand-mark">M</span><span>Mind<span>Quiz</span></span></a><div class="quiz-title"><b>Python Fundamentals</b><small>Computer Science • Practice Quiz</small></div><div class="timer" id="timer">15:00</div></header>
<main class="quiz-page"><div class="quiz-layout"><section class="question-panel"><div class="question-top"><span id="questionNumber">QUESTION 1 OF 10</span><span id="answeredCount">0 answered</span></div><div class="progress"><span id="progress"></span></div><div class="question-box"><span class="q-label">QUESTION</span><h1 id="questionText"></h1><div class="options" id="options"></div></div><div class="question-actions"><button id="prevBtn" class="outline-btn">← Previous</button><button id="nextBtn" class="next-btn">Next Question →</button></div></section><aside class="question-nav"><div><span>QUIZ NAVIGATION</span><h3>Questions</h3></div><div class="numbers" id="numbers"></div><div class="nav-legend"><span><i class="current"></i> Current</span><span><i class="answered"></i> Answered</span></div><button id="submitQuiz" class="submit-btn">Submit Quiz</button></aside></div></main>
<div class="modal" id="resultModal"><div class="result-card"><span class="result-mark">✓</span><span class="q-label">QUIZ COMPLETE</span><h2>Your result</h2><strong id="scoreValue">0 / 10</strong><p id="scoreText"><span id="scorePercent"></span></p><div class="result-actions"><a href="student.html" class="outline-btn">Back to Dashboard</a><button id="retryQuiz" class="next-btn">Try Again</button></div></div></div><script src="js/auth.js"></script><script src="js/quiz.js"></script></body></html>
